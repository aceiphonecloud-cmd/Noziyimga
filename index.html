<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sevgi sovg‘asi</title>
<style>
:root{--bg1:#fff0f4;--bg2:#ffd0df;--bg3:#f5c6ff;--card:rgba(255,255,255,.78);--text:#3a1f2b;--muted:#8a6573;--accent:#e63e6d;--accent2:#ff8fab;--line:rgba(230,62,109,.25);--in:rgba(255,255,255,.6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1016;--bg2:#3a1626;--bg3:#2a1640;--card:rgba(42,24,34,.78);--text:#fbe9ef;--muted:#c79aab;--accent:#ff6b93;--accent2:#c2365f;--line:rgba(255,107,147,.3);--in:rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg1:#1d1016;--bg2:#3a1626;--bg3:#2a1640;--card:rgba(42,24,34,.78);--text:#fbe9ef;--muted:#c79aab;--accent:#ff6b93;--accent2:#c2365f;--line:rgba(255,107,147,.3);--in:rgba(0,0,0,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;animation:bg 18s ease infinite;color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
main{max-width:480px;margin:0 auto;padding:20px 16px 60px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(230,62,109,.12)}
h1{text-align:center;font-size:26px;margin:6px 0 14px}
label{display:block;font:600 14px system-ui,sans-serif;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--in);color:var(--text);font:16px system-ui,sans-serif}
textarea{min-height:130px;resize:vertical}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.hide{display:none!important}
.photo{width:180px;height:180px;border-radius:50%;object-fit:cover;display:block;margin:4px auto 14px;border:4px solid var(--accent2);box-shadow:0 0 0 8px var(--line),0 10px 30px rgba(230,62,109,.35);animation:beat 2s ease-in-out infinite}
.ph{width:180px;height:180px;border-radius:50%;margin:4px auto 14px;display:flex;align-items:center;justify-content:center;font-size:76px;background:var(--line);animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.05)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
.names{text-align:center;font-size:26px;margin:0 0 4px;color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin:0 0 16px;font-style:italic}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.cd div{background:var(--in);border:1px solid var(--line);border-radius:16px;padding:10px 2px}
.cd b{display:block;font:800 24px system-ui,sans-serif;color:var(--accent)}
.cd span{font:12px system-ui,sans-serif;color:var(--muted)}
.letter{white-space:pre-wrap;font-size:18px;min-height:60px}
.sig{text-align:right;color:var(--accent);margin-top:10px;font-style:italic}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gal img{flex:0 0 78%;height:260px;object-fit:cover;border-radius:18px;scroll-snap-align:center;border:3px solid var(--in);cursor:zoom-in}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:24px;text-align:center}
#intro .env{font-size:96px;animation:beat 1.6s infinite}
#intro button{width:auto;padding:14px 36px}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#lb img{max-width:100%;max-height:90vh;border-radius:12px}
#mus{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:15;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 12px;backdrop-filter:blur(8px)}
#mus button{width:36px;height:36px;margin:0;padding:0;border-radius:50%;font-size:16px}
#mus input{width:80px;padding:0;border:0;background:none}
.h{position:fixed;bottom:-40px;opacity:.65;animation:up linear forwards;z-index:0;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
</style>
</head>
<body>
<main>
<section id="edit" class="card">
<h1>💝 Sovg‘a sahifa yarating</h1>
<label>Sevgilingiz ismi</label><input id="to" placeholder="Masalan: Madina">
<label>Sizning ismingiz</label><input id="from" placeholder="Masalan: Jasur">
<label>Birga bo‘lgan sana</label><input id="date" type="date">
<label>Toy sanasi (ixtiyoriy)</label><input id="wed" type="date">
<label>Asosiy rasm (ixtiyoriy)</label><input id="pic" type="file" accept="image/*">
<label>Galereya rasmlari (bir nechta tanlang)</label><input id="gp" type="file" accept="image/*" multiple>
<label>O‘z musiqangiz (ixtiyoriy, bo‘lmasa yumshoq melodiya chaladi)</label><input id="mf" type="file" accept="audio/*">
<label>Xatingiz</label><textarea id="msg" placeholder="Yuragingizdagi so‘zlarni yozing..."></textarea>
<button onclick="make()">Sovg‘ani yaratish 🎁</button>
</section>

<section id="gift" class="hide">
<div class="card rv"><div id="phw"></div><h2 class="names" id="nm"></h2><p class="sub">Biz birga bo‘lganimizga</p>
<div class="cd"><div><b id="cd">0</b><span>kun</span></div><div><b id="ch">0</b><span>soat</span></div><div><b id="cm">0</b><span>daqiqa</span></div><div><b id="cs">0</b><span>soniya</span></div></div></div>
<div class="card rv hide" id="wc"><h2 class="names">💍 One day gacha</h2><p class="sub" id="wl">Toyimizgacha qoldi</p>
<div class="cd"><div><b id="wd">0</b><span>kun</span></div><div><b id="wh">0</b><span>soat</span></div><div><b id="wm">0</b><span>daqiqa</span></div><div><b id="ws">0</b><span>soniya</span></div></div></div>
<div class="card rv"><div class="letter" id="lt"></div><div class="sig" id="sg"></div></div>
<div class="card rv hide" id="gc"><div class="gal" id="gl"></div></div>

</section>
</main>

<div id="intro" class="hide"><div class="env">💌</div><h2 id="it"></h2><p class="sub">Sizga maxsus sovg‘a bor</p><button onclick="openGift()">Ochish</button></div>
<div id="mus" class="hide"><button id="mb" onclick="toggleMusic()">⏸</button><input id="vol" type="range" min="0" max="100" value="50" aria-label="Ovoz"></div>
<div id="lb" class="hide" onclick="this.classList.add('hide')"><img id="lbi" alt=""></div>

<script>
var $=function(i){return document.getElementById(i)},photo='',gal=[],musicUrl='',tm=null,hm=null,ty=null,start=null;
try{var sv=JSON.parse(localStorage.getItem('sevgi')||'null');if(sv){$('to').value=sv.to||'';$('from').value=sv.from||'';$('date').value=sv.date||'';$('msg').value=sv.msg||'';$('wed').value=sv.wed||''}}catch(e){}
function rd(f){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result)};r.readAsDataURL(f)})}
$('pic').addEventListener('change',function(){if(this.files[0])rd(this.files[0]).then(function(d){photo=d})});
$('gp').addEventListener('change',function(){Promise.all(Array.prototype.map.call(this.files,rd)).then(function(a){gal=a})});
$('mf').addEventListener('change',function(){if(this.files[0])musicUrl=URL.createObjectURL(this.files[0])});

function make(){
var to=$('to').value.trim(),fr=$('from').value.trim(),d=$('date').value,msg=$('msg').value.trim();
if(!to||!d||!msg){alert('Ism, sana va xatni to‘ldiring 🙂');return}
try{localStorage.setItem('sevgi',JSON.stringify({to:to,from:fr,date:d,msg:msg,wed:$('wed').value}))}catch(e){}
start=new Date(d+'T00:00:00').getTime();
$('phw').innerHTML=photo?'<img class="photo" src="'+photo+'" alt="">':'<div class="ph">❤️</div>';
$('nm').textContent=(fr?fr+' ❤️ ':'')+to;
$('it').textContent=to+', bu sizga';
$('sg').textContent=fr?'— '+fr:'';
$('gl').innerHTML='';
gal.forEach(function(s){var i=document.createElement('img');i.src=s;i.alt='';i.onclick=function(){$('lbi').src=s;$('lb').classList.remove('hide')};$('gl').appendChild(i)});
$('gc').classList.toggle('hide',!gal.length);
window.wt=$('wed').value?new Date($('wed').value+'T00:00:00').getTime():0;
$('wc').classList.toggle('hide',!window.wt);
$('edit').classList.add('hide');$('intro').classList.remove('hide');window.scrollTo(0,0)}

function openGift(){
$('intro').classList.add('hide');$('gift').classList.remove('hide');$('mus').classList.remove('hide');
document.querySelectorAll('.rv').forEach(function(e,i){e.classList.remove('in');setTimeout(function(){e.classList.add('in')},200+i*500)});
tick();clearInterval(tm);tm=setInterval(tick,1000);
setTimeout(function(){type($('edit') && $('msg').value.trim())},900);
clearInterval(hm);hm=setInterval(heart,500);startMusic()}

function tick(){var s=Math.max(0,Math.floor((Date.now()-start)/1000));
$('cd').textContent=Math.floor(s/86400);$('ch').textContent=Math.floor(s%86400/3600);$('cm').textContent=Math.floor(s%3600/60);$('cs').textContent=s%60;
if(window.wt){var w=Math.floor((window.wt-Date.now())/1000);if(w<0){w=0;$('wl').textContent='Toy kuni keldi! 🎉'}else{$('wl').textContent='Toyimizgacha qoldi'}
$('wd').textContent=Math.floor(w/86400);$('wh').textContent=Math.floor(w%86400/3600);$('wm').textContent=Math.floor(w%3600/60);$('ws').textContent=w%60}}
function type(t){clearInterval(ty);var i=0,el=$('lt');el.textContent='';ty=setInterval(function(){el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(ty)},40)}
function heart(){var h=document.createElement('div');h.className='h';h.textContent=['💖','💕','❤️','💗','✨'][Math.floor(Math.random()*5)];h.style.left=Math.random()*95+'vw';h.style.fontSize=(16+Math.random()*20)+'px';h.style.animationDuration=(5+Math.random()*5)+'s';document.body.appendChild(h);setTimeout(function(){h.remove()},10500)}

var ac=null,mi=null,aud=null,on=false,step=0;
var chords=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]],pat=[0,1,2,1,2,1,0,1];
function vol(){return $('vol').value/100}
function note(){
var t=ac.currentTime,i=step++,ch=chords[Math.floor(i/8)%4],f=ch[pat[i%8]]*2,v=vol();
function pl(fr,ty2,g,d){var o=ac.createOscillator(),n=ac.createGain();o.type=ty2;o.frequency.value=fr;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g*v,t+.04);n.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
pl(f,'sine',.22,1.4);if(i%8===0)pl(ch[0]/2,'triangle',.25,3)}
function startMusic(){
on=true;$('mb').textContent='⏸';
if(musicUrl){aud=aud||new Audio(musicUrl);aud.loop=true;aud.volume=vol();aud.play().catch(function(){});return}
try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();clearInterval(mi);mi=setInterval(note,430)}catch(e){}}
function stopMusic(){on=false;$('mb').textContent='▶';clearInterval(mi);if(aud)aud.pause()}
function toggleMusic(){on?stopMusic():startMusic()}
$('vol').addEventListener('input',function(){if(aud)aud.volume=vol()});

function back(){clearInterval(tm);clearInterval(ty);clearInterval(hm);stopMusic();$('gift').classList.add('hide');$('mus').classList.add('hide');$('edit').classList.remove('hide')}
